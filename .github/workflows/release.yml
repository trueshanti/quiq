name: 'publish'

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-tauri:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      - name: install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            xdg-utils \
            zsync \
            squashfs-tools

      - name: shim libwebkit2gtk private binaries at the openSUSE-style path
        # tauri.conf.json's appimage.files expects /usr/libexec/libwebkit2gtk-4_1-0/*,
        # but Ubuntu's multiarch package layout puts them elsewhere
        run: |
          set -euo pipefail
          sudo mkdir -p /usr/libexec/libwebkit2gtk-4_1-0
          for bin in WebKitNetworkProcess WebKitWebProcess WebKitGPUProcess; do
            src="$(find /usr/lib -type f -name "$bin" 2>/dev/null | head -n1)"
            if [ -z "$src" ]; then
              echo "could not locate $bin under /usr/lib" >&2
              exit 1
            fi
            sudo ln -sf "$src" "/usr/libexec/libwebkit2gtk-4_1-0/$bin"
          done

      - name: setup node
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: 'npm'

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: install frontend dependencies
        run: npm install

      - name: pre-fetch AppImage runtime
        # appimagetool's bundled downloader can hang fetching this itself;
        # pre-fetching and pointing linuxdeploy-plugin-appimage at it via
        # LDAI_RUNTIME_FILE avoids that entirely.
        run: |
          curl -L -o /tmp/runtime-x86_64 \
            https://github.com/AppImage/type2-runtime/releases/download/continuous/runtime-x86_64

      - name: build
        id: tauri-build
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LDAI_RUNTIME_FILE: /tmp/runtime-x86_64
          LDAI_UPDATE_INFORMATION: 'gh-releases-zsync|trueshanti|quiq|latest|quiq-*.AppImage'
        # omitting tagName/releaseName/releaseId makes tauri-action build only,
        # so we control the AppImageHub-compliant asset names/upload ourselves below

      - name: fix AppImage permissions
        # the runner's umask strips group/other read+execute from files copied
        # into the AppDir (e.g. AppRun.wrapped ends up mode 750), so the
        # AppImage fails to launch for any other user - notably the
        # AppImageHub CI test bot. Extract, fix perms, repack.
        run: |
          set -euo pipefail

          BUNDLE_DIR="$GITHUB_WORKSPACE/src-tauri/target/release/bundle/appimage"
          APPIMAGE="$(find "$BUNDLE_DIR" -maxdepth 1 -name '*.AppImage' | head -n1)"

          if [ -z "$APPIMAGE" ]; then
            echo "No .AppImage found in $BUNDLE_DIR" >&2
            exit 1
          fi

          WORKDIR="$(mktemp -d)"
          cp "$APPIMAGE" "$WORKDIR/orig.AppImage"
          chmod +x "$WORKDIR/orig.AppImage"
          (cd "$WORKDIR" && ./orig.AppImage --appimage-extract >/dev/null)

          chmod -R u+rwX,go+rX "$WORKDIR/squashfs-root"

          # keep the original runtime section (bytes before the squashfs
          # offset) rather than the plain pre-fetched runtime, since it has
          # the update info embedded by LDAI_UPDATE_INFORMATION
          OFFSET="$("$WORKDIR/orig.AppImage" --appimage-offset)"
          dd if="$WORKDIR/orig.AppImage" of="$WORKDIR/runtime" bs=1 count="$OFFSET" status=none

          mksquashfs "$WORKDIR/squashfs-root" "$WORKDIR/new.squashfs" -root-owned -noappend
          cat "$WORKDIR/runtime" "$WORKDIR/new.squashfs" > "$APPIMAGE"
          chmod +x "$APPIMAGE"
          rm -rf "$WORKDIR"

      - name: rename appimage to AppImageHub convention
        run: node scripts/rename-appimage.mjs

      - name: generate zsync sidecar
        run: |
          set -euo pipefail

          BUNDLE_DIR="$GITHUB_WORKSPACE/src-tauri/target/release/bundle/appimage"
          APPIMAGE="$(find "$BUNDLE_DIR" -maxdepth 1 -name '*.AppImage' | head -n1)"

          if [ -z "$APPIMAGE" ]; then
            echo "No .AppImage found in $BUNDLE_DIR" >&2
            exit 1
          fi

          # zsyncmake always writes "<basename>.zsync" into the CURRENT
          # directory (not next to the input file), so cd into the bundle
          # dir first and use a relative filename.
          cd "$BUNDLE_DIR"
          APPIMAGE_NAME="$(basename "$APPIMAGE")"
          zsyncmake -u "$APPIMAGE_NAME" "$APPIMAGE_NAME"

      - name: create release and upload assets
        run: |
          set -euo pipefail

          RPM="$(find "$GITHUB_WORKSPACE/src-tauri/target/release/bundle/rpm" -maxdepth 1 -name '*.rpm')"

          gh release create "${{ github.ref_name }}" \
            --title "quiq ${{ github.ref_name }}" \
            --notes "See the assets to download this version and install." \
            --draft \
            "$GITHUB_WORKSPACE"/src-tauri/target/release/bundle/appimage/*.AppImage \
            "$GITHUB_WORKSPACE"/src-tauri/target/release/bundle/appimage/*.AppImage.zsync \
            $RPM
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
